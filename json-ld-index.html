<!-- ============================================
     JSON-LD для index.html — вставить в <head> или
     перед </body>
     Значения проверены только по контенту, который есть
     на странице — не добавляй сюда ничего, чего нет
     видимого пользователю на самой странице (это требование
     Google, п.7 ТЗ)
     ============================================ -->

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "name": "Crystal Water",
  "image": "https://crystalwater.kiev.ua/assets/images/placeholder.png",
  "telephone": ["+380637886880", "+380635304050"],
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "ул. Кооперативная, 3 А",
    "addressLocality": "Бровары",
    "addressCountry": "UA"
  },
  "openingHoursSpecification": [
    {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"],
      "opens": "08:00",
      "closes": "20:00"
    },
    {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": ["Saturday","Sunday"],
      "opens": "09:00",
      "closes": "17:00"
    }
  ],
  "url": "https://crystalwater.kiev.ua/",
  "sameAs": [
    "https://www.instagram.com/crystalwater.brovary/",
    "https://www.facebook.com/crystalwater.brovary/",
    "https://t.me/CrystalWaterBro_bot"
  ]
}
</script>

<!-- BreadcrumbList — пример для главной, на внутренних страницах
     дополнить реальными хлебными крошками той страницы -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Доставка воды Бровары",
      "item": "https://crystalwater.kiev.ua/"
    }
  ]
}
</script>

     на странице (условие Google). Если на сайте нет видимого FAQ-блока —
     сначала добавь его в HTML, потом эту разметку. Не публикуй одну
     разметку без соответствующего видимого текста. -->
